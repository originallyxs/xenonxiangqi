<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>公告栏</title>
<style>
@font-face {
    font-family: 'customFont';
    src: url('./your-font-regular.woff2') format('woff2');
    font-weight: 400; /* 常规粗细 */
    font-style: normal;
}
@font-face {
    font-family: 'customFont';
    src: url('./your-font-bold.woff2') format('woff2');
    font-weight: 700; /* 粗体 */
    font-style: normal;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html,body{
  background:transparent; /* 背景透明，嵌入作品 */
  color:#2196f3;
  padding:12px; /* 整体边距12px */
  font-family:customFont, system-ui, sans-serif;
}
.font-normal{
  font-weight:400;
}
.font-bold{
  font-weight:700;
}
.notice-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:12px;
}
.notice-item{
  padding:8px 0;
}
.divider{
  height:1px;
  background:rgba(255,255,255,0.35);
  margin:8px 0;
}
</style>
</head>
<body>
<div class="notice-title font-bold">公告栏</div>

<div class="notice-item font-normal">
2026‑08‑07 系统维护通知
</div>
<div class="divider"></div>

<div class="notice-item font-normal">
2026‑08‑05 版本V2.10更新上线
</div>
<div class="divider"></div>

<div class="notice-item font-normal">
2026‑08‑01 用户账号安全须知
</div>

</body>
</html>

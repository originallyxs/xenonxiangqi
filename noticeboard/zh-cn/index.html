<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>公告栏</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html,body{
  background:transparent; /* 背景完全透明，用于嵌入作品 */
  color:#fff;
  padding:12px; /* 整体边距12px */
  font-family:customFont, system-ui, sans-serif; /* 使用作品自定义字体 */
}
/* 两种字重：400常规 / 700粗体 */
.font-normal{
  font-weight:400;
}
.font-bold{
  font-weight:700;
}
.notice-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:12px;
}
.notice-item{
  padding:8px 0;
}
.divider{
  height:1px;
  background:rgba(255,255,255,0.35); /*半透分割线，适配透明背景*/
  margin:8px 0;
}
</style>
</head>
<body>
<div class="notice-title font-bold">公告栏</div>

<div class="notice-item font-normal">
2026‑08‑07 系统维护通知
</div>
<div class="divider"></div>

<div class="notice-item font-normal">
2026‑08‑05 版本V2.10更新上线
</div>
<div class="divider"></div>

<div class="notice-item font-normal">
2026‑08‑01 用户账号安全须知
</div>

</body>
</html>

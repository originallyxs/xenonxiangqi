<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="574.916" height="342.218" viewBox="0,0,574.916,342.218"><g transform="translate(-112.74037,-57.49685)"><g fill="#ffffff" stroke="none" stroke-miterlimit="10" font-size="40"><text transform="translate(224.70723,87.67488) scale(0.87956,0.87956)" font-size="40" xml:space="preserve" fill="#ffffff" font-family="&quot;Default-Bold&quot;, Handwriting"><tspan x="0" dy="0">警告：请在游玩前阅读</tspan></text><text transform="translate(113.04031,143.45111) scale(0.59988,0.59988)" font-size="40" xml:space="preserve" fill="#ffffff" font-family="&quot;Default-Regular&quot;, Handwriting"><tspan x="0" dy="0">当暴露在特定光影图案或闪光光亮下时，</tspan><tspan x="0" dy="46.15px">有极小部分人群会引发癫痫。</tspan><tspan x="0" dy="46.15px">这种情形可能是由于某些未查出的癫痫症状引起，</tspan><tspan x="0" dy="46.15px">即使该人员并没有患癫痫病史也有可能造成此类病症。</tspan><tspan x="0" dy="46.15px">如果您的家人或任何家庭成员曾有过类似症状，</tspan><tspan x="0" dy="46.15px">请在进行游戏前咨询您的医生或医师。</tspan><tspan x="0" dy="46.15px">如果您在游戏过程中出现任何症状，包括头晕、目眩、</tspan><tspan x="0" dy="46.15px">眼部或肌肉抽搐、失去意识、失去方向感、抽搐、</tspan><tspan x="0" dy="46.15px">或出现任何自己无法控制的动作，</tspan><tspan x="0" dy="46.15px">请立即停止游戏并在继续游戏前咨询您的医生或医师。</tspan></text></g></g></svg>